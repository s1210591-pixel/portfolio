<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learning Task 5.1</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fff; }
  .box { display: inline-block; margin: 10px; }
  svg { border: 3px solid #f4877d; background: white; }
  p { font-size: 14px; margin: 5px; }
</style>
</head>
<body>

<h1>Learning Task 5.1</h1>

<div class="box">
  <svg width="200" height="300">
    <line x1="0" y1="60" x2="200" y2="60" stroke="#f4877d" stroke-width="4" />
    <line x1="50" y1="0" x2="50" y2="300" stroke="#f4877d" stroke-width="4" />
    <line x1="0" y1="250" x2="200" y2="250" stroke="#16b5b0" stroke-width="4" />
    <circle cx="50" cy="60" r="30" fill="#16b5b0" />
    <circle cx="140" cy="130" r="25" fill="#f4877d" />
    <circle cx="70" cy="200" r="35" fill="#16b5b0" />
    <circle cx="70" cy="200" r="15" fill="white" />
    <circle cx="150" cy="250" r="20" fill="#f4877d" />
  </svg>
  <p>1. Line and Circle</p>
</div>

<div class="box">
  <svg width="200" height="300" style="background:#16b5b0">
    <rect x="10" y="10" width="180" height="130" fill="#f4877d" />
    <rect x="10" y="160" width="180" height="130" fill="#f4877d" />
    <circle cx="40" cy="50" r="15" fill="white" />
    <circle cx="100" cy="50" r="15" fill="#16b5b0" />
    <circle cx="160" cy="50" r="15" fill="white" />
    <circle cx="40" cy="100" r="15" fill="#16b5b0" />
    <circle cx="100" cy="100" r="15" fill="white" />
    <circle cx="160" cy="100" r="15" fill="#16b5b0" />
    <circle cx="40" cy="200" r="15" fill="white" />
    <circle cx="100" cy="200" r="15" fill="#16b5b0" />
    <circle cx="160" cy="200" r="15" fill="white" />
    <circle cx="40" cy="250" r="15" fill="#16b5b0" />
    <circle cx="100" cy="250" r="15" fill="white" />
    <circle cx="160" cy="250" r="15" fill="#16b5b0" />
  </svg>
  <p>2. Circle and Rectangle</p>
</div>

<div class="box">
  <svg width="200" height="300">
    <polyline points="0,50 25,30 50,50 75,30 100,50 125,30 150,50 175,30 200,50" fill="none" stroke="#f4877d" stroke-width="8" />
    <polyline points="0,120 25,100 50,120 75,100 100,120 125,100 150,120 175,100 200,120" fill="none" stroke="#16b5b0" stroke-width="8" />
    <polyline points="0,190 25,170 50,190 75,170 100,190 125,170 150,190 175,170 200,190" fill="none" stroke="#f5c242" stroke-width="8" />
    <polyline points="0,260 25,240 50,260 75,240 100,260 125,240 150,260 175,240 200,260" fill="none" stroke="#f4877d" stroke-width="8" />
    <circle cx="25" cy="75" r="8" fill="#b5b0ac" />
    <circle cx="75" cy="75" r="8" fill="#b5b0ac" />
    <circle cx="125" cy="75" r="8" fill="#b5b0ac" />
    <circle cx="175" cy="75" r="8" fill="#b5b0ac" />
    <circle cx="25" cy="145" r="8" fill="#f4877d" />
    <circle cx="75" cy="145" r="8" fill="#f4877d" />
    <circle cx="125" cy="145" r="8" fill="#f4877d" />
    <circle cx="175" cy="145" r="8" fill="#f4877d" />
    <circle cx="25" cy="215" r="8" fill="#16b5b0" />
    <circle cx="75" cy="215" r="8" fill="#16b5b0" />
    <circle cx="125" cy="215" r="8" fill="#16b5b0" />
    <circle cx="175" cy="215" r="8" fill="#16b5b0" />
  </svg>
  <p>3. Polyline and Circle</p>
</div>

<div class="box">
  <svg width="200" height="300">
    <polygon points="0,0 100,50 200,0 200,40 100,90 0,40" fill="#f4877d" />
    <polygon points="0,210 100,260 200,210 200,250 100,300 0,250" fill="#16b5b0" />
    <ellipse cx="35" cy="150" rx="22" ry="38" fill="#b5b0ac" />
    <ellipse cx="100" cy="150" rx="22" ry="38" fill="#b5b0ac" />
    <ellipse cx="165" cy="150" rx="22" ry="38" fill="#b5b0ac" />
  </svg>
  <p>4. Polygon and Ellipse</p>
</div>

<div class="box">
  <svg width="200" height="300" style="background:#16b5b0">
    <rect x="10" y="20" width="180" height="50" fill="#f4877d" />
    <rect x="10" y="90" width="180" height="50" fill="#f4877d" />
    <rect x="10" y="160" width="180" height="50" fill="#f4877d" />
    <rect x="10" y="230" width="180" height="50" fill="#f4877d" />
    <line x1="10" y1="80" x2="190" y2="80" stroke="white" stroke-width="3" />
    <line x1="10" y1="150" x2="190" y2="150" stroke="white" stroke-width="3" />
    <line x1="10" y1="220" x2="190" y2="220" stroke="white" stroke-width="3" />
    <circle cx="30" cy="45" r="8" fill="white" />
    <circle cx="65" cy="45" r="8" fill="white" />
    <circle cx="100" cy="45" r="8" fill="white" />
    <circle cx="135" cy="45" r="8" fill="white" />
    <circle cx="170" cy="45" r="8" fill="white" />
    <circle cx="30" cy="185" r="8" fill="white" />
    <circle cx="65" cy="185" r="8" fill="white" />
    <circle cx="100" cy="185" r="8" fill="white" />
    <circle cx="135" cy="185" r="8" fill="white" />
    <circle cx="170" cy="185" r="8" fill="white" />
  </svg>
  <p>5. Circle, Line and Rectangle</p>
</div>

<div class="box">
  <svg width="200" height="300" style="background:#16b5b0">
    <polyline points="0,40 25,20 50,40 75,20 100,40 125,20 150,40 175,20 200,40" fill="none" stroke="white" stroke-width="6" />
    <polygon points="100,80 160,115 160,185 100,220 40,185 40,115" fill="#f4877d" />
    <polygon points="100,115 130,165 70,165" fill="white" />
    <polyline points="0,270 25,250 50,270 75,250 100,270 125,250 150,270 175,250 200,270" fill="none" stroke="#f4877d" stroke-width="6" />
  </svg>
  <p>6. Polyline and Polygon</p>
</div>

<div class="box">
  <svg width="200" height="300">
    <rect x="0" y="0" width="200" height="40" fill="#16b5b0" />
    <circle cx="30" cy="70" r="15" fill="#f4877d" />
    <circle cx="80" cy="70" r="15" fill="#16b5b0" />
    <circle cx="130" cy="70" r="15" fill="#f4877d" />
    <circle cx="170" cy="70" r="15" fill="#16b5b0" />
    <ellipse cx="100" cy="140" rx="60" ry="25" fill="#b5b0ac" />
    <polygon points="100,170 160,230 40,230" fill="#f4877d" />
    <polyline points="0,265 25,245 50,265 75,245 100,265 125,245 150,265 175,245 200,265" fill="none" stroke="#16b5b0" stroke-width="6" />
    <rect x="0" y="285" width="200" height="15" fill="#f4877d" />
  </svg>
  <p>7. Circle, Rectangle, Polyline, Polygon and Ellipse</p>
</div>

</body>
</html>
